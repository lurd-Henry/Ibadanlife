<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#101713">

    <title>Lagos Life</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game.css">
</head>

<body>

    <!-- CHARACTER SELECTION -->
    <section id="character-screen" class="screen">
        <div class="character-card">

            <div class="brand">
                <span class="brand-icon">L</span>

                <div>
                    <h1>LAGOS LIFE</h1>
                    <p>YOUR CITY. YOUR STORY.</p>
                </div>
            </div>

            <h2>Create Your Character</h2>

            <p class="screen-description">
                Enter Lagos and build your own life.
            </p>

            <label for="character-name">Character name</label>

            <input
                type="text"
                id="character-name"
                maxlength="18"
                placeholder="Enter your name"
                autocomplete="off"
            >

            <p class="selection-label">Choose your character</p>

            <div class="gender-options">

                <button
                    type="button"
                    class="gender-option selected"
                    data-gender="male"
                    aria-pressed="true"
                >
                    <span class="gender-avatar male-avatar">♂</span>
                    <span>Male</span>
                </button>

                <button
                    type="button"
                    class="gender-option"
                    data-gender="female"
                    aria-pressed="false"
                >
                    <span class="gender-avatar female-avatar">♀</span>
                    <span>Female</span>
                </button>

            </div>

            <button id="start-game" class="primary-button">
                ENTER LAGOS →
            </button>

            <p class="small-note">
                Your journey starts here.
            </p>

        </div>
    </section>


    <!-- GAME -->
    <main id="game-screen" class="screen hidden">

        <header id="game-header">

            <div class="player-info">
                <div id="player-avatar" class="mini-avatar">♂</div>

                <div class="player-details">
                    <strong id="hud-player-name">Player</strong>
                    <span id="hud-location">Lagos Mainland</span>
                </div>
            </div>

            <div class="money-card">
                <span>CASH</span>
                <strong id="hud-cash">₦5,000</strong>
            </div>

            <button
                id="fullscreen-button"
                class="icon-button"
                aria-label="Toggle fullscreen"
                title="Fullscreen"
            >⛶</button>

        </header>


        <!-- GAME WORLD -->
        <section id="game-area">

            <canvas
                id="game-canvas"
                width="960"
                height="600"
                aria-label="Lagos Life game world"
            ></canvas>

            <div id="game-message" class="game-message hidden"></div>

            <div id="pause-overlay" class="pause-overlay hidden">
                <div class="pause-card">
                    <h2>GAME PAUSED</h2>
                    <p>Take a breather.</p>

                    <button id="resume-game" class="primary-button">
                        RESUME GAME
                    </button>
                </div>
            </div>


            <!-- MOBILE GAME CONTROLS -->
            <div id="game-controls">

                <div class="joystick-area">
                    <div id="joystick-base" aria-label="Movement joystick">
                        <div id="joystick-knob"></div>
                    </div>
                    <span class="control-caption">MOVE</span>
                </div>

                <div class="action-controls">

                    <button id="run-button" class="action-button">
                        RUN
                    </button>

                    <button id="interact-button" class="action-button interact-button">
                        INTERACT
                    </button>

                </div>

            </div>

        </section>


        <!-- BOTTOM INFORMATION BAR -->
        <footer id="game-footer">

            <div>
                <span class="status-dot"></span>
                <span id="hud-status">Exploring Lagos</span>
            </div>

            <button id="pause-button" class="footer-button">
                Ⅱ PAUSE
            </button>

        </footer>

    </main>


    <!-- LOAD GAME SYSTEMS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/player.js"></script>
<script src="js/world.js"></script>
<script src="js/missions.js"></script>
<script src="js/ui.js"></script>
<script src="js/joystick.js"></script>
<script src="js/interiors.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>

</body>
</html>
